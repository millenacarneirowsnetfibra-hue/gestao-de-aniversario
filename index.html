<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Aniversariantes</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --light: #f8fafc;
            --dark: #1e293b;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: var(--gray-100);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--dark) 0%, #0f172a 100%);
            color: white;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i {
            color: var(--primary);
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-section {
            margin-bottom: 20px;
        }

        .nav-section-title {
            padding: 8px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-300);
            font-weight: 600;
        }

        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--gray-200);
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.2);
            border-left-color: var(--primary);
            color: white;
        }

        .nav-item i {
            width: 20px;
            font-size: 1.1rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9998;
        }

        .toast {
            background: white;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.info {
            border-left-color: var(--info);
        }

        .toast i {
            font-size: 1.25rem;
        }

        .toast.success i {
            color: var(--success);
        }

        .toast.error i {
            color: var(--danger);
        }

        .toast.info i {
            color: var(--info);
        }

        .toast-message {
            flex: 1;
            color: var(--dark);
        }

        .toast-close {
            cursor: pointer;
            color: var(--gray-300);
            transition: color 0.2s ease;
        }

        .toast-close:hover {
            color: var(--dark);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Cards */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header h3 {
            color: var(--secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card-header i {
            font-size: 1.5rem;
            color: var(--primary);
            opacity: 0.8;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--dark);
        }

        /* Filters */
        .filters-container {
            background: white;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .filters-header {
            padding: 15px 20px;
            background: var(--gray-100);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            color: var(--dark);
        }

        .filters-header i {
            transition: transform 0.3s ease;
        }

        .filters-header.expanded i {
            transform: rotate(180deg);
        }

        .filters-content {
            max-height: 0;
            padding: 0 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            background: white;
        }

        .filters-content.expanded {
            max-height: 500px;
            padding: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 500;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Cards List */
        .cards-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .person-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            position: relative;
        }

        .person-card.past-birthday {
            background-color: var(--gray-200);
            opacity: 0.8;
        }

        .person-card.past-birthday .person-info h4,
        .person-card.past-birthday .person-info p {
            color: var(--gray-600);
        }

        .person-card.past-birthday .city-badge {
            background-color: var(--gray-400);
            color: var(--gray-700);
        }

        .person-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .person-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .person-info h4 {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .person-info p {
            font-size: 0.9rem;
            color: var(--secondary);
            margin-bottom: 3px;
        }

        .person-info i {
            width: 18px;
            margin-right: 5px;
            color: var(--primary);
        }

        .city-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .city-badge.outside {
            background: #fee2e2;
            color: #991b1b;
        }

        .city-badge.mongagua {
            background: #fef3c7;
            color: #92400e;
        }

        .date-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--primary);
            color: white;
        }

        /* Checklist */
        .checklist-container {
            margin-top: 15px;
            border-top: 1px solid var(--gray-200);
            padding-top: 15px;
        }

        .checklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .checklist-progress {
            width: 100%;
            height: 6px;
            background: var(--gray-200);
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }

        .checklist-progress-bar {
            height: 100%;
            background: var(--success);
            transition: width 0.3s ease;
        }

        .checklist-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .checklist-items.expanded {
            max-height: 500px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-100);
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checklist-item .item-text {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            cursor: text;
            position: relative;
        }

        .checklist-item .item-text.checked {
            text-decoration: line-through;
            color: var(--gray-500);
            background-color: var(--gray-100);
        }

        .checklist-item-actions {
            display: flex;
            gap: 5px;
        }

        .checklist-item-actions button {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .checklist-item-actions button:hover {
            background: var(--gray-100);
        }

        .checklist-item-actions button.edit:hover {
            color: var(--primary);
        }

        .checklist-item-actions button.delete:hover {
            color: var(--danger);
        }

        .add-checklist-item {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }

        .add-checklist-item input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--gray-200);
            border-radius: 4px;
        }

        .add-checklist-item button {
            padding: 8px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .add-checklist-item button:hover {
            background: var(--primary-dark);
        }

        /* Post Text */
        .post-container {
            margin-top: 15px;
            border-top: 1px solid var(--gray-200);
            padding-top: 15px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .post-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .post-content.expanded {
            max-height: 500px;
        }

        .post-text {
            background: var(--gray-100);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .post-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 10px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Pizza Order */
        .pizza-order {
            margin-top: 15px;
            border-top: 1px solid var(--gray-200);
            padding-top: 15px;
        }

        .pizza-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .pizza-order-form {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .pizza-order-form.expanded {
            max-height: 1000px;
        }

        .pizza-order-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .pizza-order-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pizza-order-field.full-width {
            grid-column: span 2;
        }

        .pizza-order-field label {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 500;
        }

        .pizza-order-field input,
        .pizza-order-field select,
        .pizza-order-field textarea {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Tables */
        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: var(--gray-100);
            color: var(--secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.outside-region td {
            background: #fee2e2;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge.active {
            background: #dcfce7;
            color: #166534;
        }

        .badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .action-buttons button:hover {
            background: var(--gray-100);
        }

        .action-buttons button.edit:hover {
            color: var(--primary);
        }

        .action-buttons button.delete:hover {
            color: var(--danger);
        }

        /* Forms */
        .form-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .form-title {
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--gray-200);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        /* Charts Placeholder */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .chart-placeholder {
            height: 250px;
            background: linear-gradient(135deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
            margin-top: 15px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .dashboard-cards {
                grid-template-columns: 1fr;
            }

            .cards-list {
                grid-template-columns: 1fr;
            }

            .pizza-order-grid {
                grid-template-columns: 1fr;
            }

            .pizza-order-field.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>
                <i class="fas fa-birthday-cake"></i>
                Gestão de Aniversariantes
            </h2>
        </div>
        
        <div class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Principal</div>
                <div class="nav-item active" data-section="dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Aniversários</div>
                <div class="nav-item" data-section="vida">
                    <i class="fas fa-child"></i>
                    <span>Aniversário de Vida</span>
                </div>
                <div class="nav-item" data-section="empresa">
                    <i class="fas fa-building"></i>
                    <span>Aniversário de Empresa</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Controle</div>
                <div class="nav-item" data-section="financeiro">
                    <i class="fas fa-chart-line"></i>
                    <span>Controle Financeiro</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Pizzas</div>
                <div class="nav-item" data-section="pizzas">
                    <i class="fas fa-pizza-slice"></i>
                    <span>Cadastro de Pizzas</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Cadastros</div>
                <div class="nav-item" data-section="colaboradores">
                    <i class="fas fa-users"></i>
                    <span>Colaboradores</span>
                </div>
                <div class="nav-item" data-section="empresas">
                    <i class="fas fa-building"></i>
                    <span>Empresas</span>
                </div>
                <div class="nav-item" data-section="departamentos">
                    <i class="fas fa-sitemap"></i>
                    <span>Departamentos</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Relatórios</div>
                <div class="nav-item" data-section="relatorios">
                    <i class="fas fa-file-alt"></i>
                    <span>Relatórios</span>
                </div>
            </div>
        </div>

        function formatDateBR(date) {
            if (!date) return '';
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${day}/${month}/${year}`;
        }

        function formatDateShortBR(date) {
            if (!date) return '';
            const d = new Date(date);
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${day}/${month}`;
        }

        function parseDateBR(dateStr) {
            if (!dateStr) return null;
            const [day, month, year] = dateStr.split('/');
            return new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
        }

        function parseDateISO(dateStr) {
            if (!dateStr) return null;
            const [year, month, day] = dateStr.split('-');
            return new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
        }

        function validateDateBR(dateStr) {
            const regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
            if (!regex.test(dateStr)) return false;
            
            const [_, day, month, year] = dateStr.match(regex);
            const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
            
            return date.getDate() === parseInt(day) &&
                   date.getMonth() === parseInt(month) - 1 &&
                   date.getFullYear() === parseInt(year);
        }

        function applyDateMask(input) {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2);
                }
                if (value.length >= 5) {
                    value = value.substring(0, 5) + '/' + value.substring(5, 9);
                }
                e.target.value = value;
            });
        }

        function calculateAge(birthDate) {
            if (!birthDate) return 0;
            const hoje = new Date();
            const nascimento = new Date(birthDate);
            let idade = hoje.getFullYear() - nascimento.getFullYear();
            const mes = hoje.getMonth() - nascimento.getMonth();
            
            if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }
            
            return idade;
        }

        function getNextBirthday(birthDate) {
            if (!birthDate) return null;
            const hoje = new Date();
            const dataNascimento = new Date(birthDate);
            
            // Cria data do aniversário deste ano
            const aniversarioEsteAno = new Date(hoje.getFullYear(), dataNascimento.getMonth(), dataNascimento.getDate());
            
            // Se o aniversário já passou este ano, pega o do próximo ano
            if (aniversarioEsteAno < hoje) {
                return new Date(hoje.getFullYear() + 1, dataNascimento.getMonth(), dataNascimento.getDate());
            }
            
            return aniversarioEsteAno;
        }

        function getDaysUntilNextBirthday(birthDate) {
            if (!birthDate) return Infinity;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            
            const proximoAniversario = getNextBirthday(birthDate);
            if (!proximoAniversario) return Infinity;
            
            const diffTime = proximoAniversario - hoje;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }

        function getNextCompanyAnniversary(admissionDate) {
            if (!admissionDate) return null;
            const hoje = new Date();
            const dataAdmissao = new Date(admissionDate);
            
            // Cria data do aniversário de empresa deste ano
            const aniversarioEsteAno = new Date(hoje.getFullYear(), dataAdmissao.getMonth(), dataAdmissao.getDate());

            if (aniversarioEsteAno < hoje) {
                return new Date(hoje.getFullYear() + 1, dataAdmissao.getMonth(), dataAdmissao.getDate());
            }
            
            return aniversarioEsteAno;
        }

        function getDaysUntilNextCompanyAnniversary(admissionDate) {

        async function loadVidaCards() {
            const container = document.getElementById('vidaCardsList');
            if (!container) return;

            showLoading();
            try {
                const snapshot = await db.collection('colaboradores').get();
                const colaboradores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Ordenar: primeiro os mais próximos, depois os que já passaram
                const colaboradoresOrdenados = [...colaboradores].sort((a, b) => {
                    const diasA = getDaysUntilNextBirthday(a.dataNascimento);
                    const diasB = getDaysUntilNextBirthday(b.dataNascimento);
                    
                    // Se um já passou (dias negativos) e o outro não
                    const aPassou = isPastBirthday(a.dataNascimento);
                    const bPassou = isPastBirthday(b.dataNascimento);
                    
                    if (aPassou && !bPassou) return 1; // a vai para o final
                    if (!aPassou && bPassou) return -1; // b vai para o final
                    
                    // Ambos não passaram ou ambos passaram - ordena por dias
                    return diasA - diasB;
                });
                
                container.innerHTML = '';
                
                for (const col of colaboradoresOrdenados) {
                    const checklistSnapshot = await db.collection('checklists')
                        .where('colaboradorId', '==', col.id)
                        .where('tipo', '==', 'vida')
                        .get();
                    
                    let checklist = null;
                    if (!checklistSnapshot.empty) {
                        checklist = { id: checklistSnapshot.docs[0].id, ...checklistSnapshot.docs[0].data() };
                    }
                    
                    const card = createVidaCard(col, checklist);
                    container.appendChild(card);
                }
            } catch (error) {
                console.error('Error loading vida cards:', error);
                showToast('Erro ao carregar aniversariantes', 'error');
            } finally {
                hideLoading();
            }
        }

            const filtroAno = document.getElementById('filtroAnoEmpresa');
            const filtroStatus = document.getElementById('filtroStatusEmpresa');
            
            if (filtroNome) filtroNome.addEventListener('input', () => filterEmpresa());
            if (filtroMes) filtroMes.addEventListener('change', () => filterEmpresa());

        async function loadEmpresaCards() {
            const container = document.getElementById('empresaCardsList');
            if (!container) return;

            showLoading();
            try {
                const snapshot = await db.collection('colaboradores').get();
                const colaboradores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Ordenar: primeiro os mais próximos, depois os que já passaram
                const colaboradoresOrdenados = [...colaboradores].sort((a, b) => {
                    const diasA = getDaysUntilNextCompanyAnniversary(a.dataAdmissao);
                    const diasB = getDaysUntilNextCompanyAnniversary(b.dataAdmissao);
                    
                    // Se um já passou (dias negativos) e o outro não
                    const aPassou = isPastBirthday(a.dataAdmissao);
                    const bPassou = isPastBirthday(b.dataAdmissao);
                    
                    if (aPassou && !bPassou) return 1; // a vai para o final
                    if (!aPassou && bPassou) return -1; // b vai para o final
                    
                    // Ambos não passaram ou ambos passaram - ordena por dias
                    return diasA - diasB;
                });
                
                container.innerHTML = '';
                
                for (const col of colaboradoresOrdenados) {
                    const checklistSnapshot = await db.collection('checklists')
                        .where('colaboradorId', '==', col.id)
                        .where('tipo', '==', 'empresa')
                        .get();
                    
                    let checklist = null;
                    if (!checklistSnapshot.empty) {
                        checklist = { id: checklistSnapshot.docs[0].id, ...checklistSnapshot.docs[0].data() };
                    }
                    
                    const card = createEmpresaCard(col, checklist);
                    container.appendChild(card);
                }
            } catch (error) {
                console.error('Error loading empresa cards:', error);
                showToast('Erro ao carregar aniversariantes', 'error');
            } finally {
                hideLoading();
            }
        }

        async function loadFinanceiroData() {
            try {
                const pedidosSnapshot = await db.collection('pedidos').get();
                const pedidos = pedidosSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                let totalGasto = 0;
                const pizzarias = new Set();
                
                for (const pedido of pedidos) {
                    if (pedido.pizzaId) {
                        const pizzaDoc = await db.collection('pizzas').doc(pedido.pizzaId).get();
                        if (pizzaDoc.exists) {
                            const pizza = pizzaDoc.data();
                            totalGasto += parseFloat(pizza.valor) || 0;
                            pizzarias.add(pizza.pizzaria);
                        }
                    }
                }
                
                const cardsContainer = document.getElementById('financeiroCards');
                if (cardsContainer) {
                    cardsContainer.innerHTML = `
                        <div class="card">
                            <div class="card-header">
                                <h3>Gasto Total</h3>
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                            <div class="card-value">R$ ${totalGasto.toFixed(2)}</div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h3>Pizzarias Ativas</h3>
                                <i class="fas fa-store"></i>
                            </div>
                            <div class="card-value">${pizzarias.size}</div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h3>Total de Pedidos</h3>
                                <i class="fas fa-shopping-cart"></i>
                            </div>
                            <div class="card-value">${pedidos.length}</div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h3>Média por Pedido</h3>
                                <i class="fas fa-calculator"></i>
                            </div>
                            <div class="card-value">R$ ${pedidos.length > 0 ? (totalGasto / pedidos.length).toFixed(2) : '0.00'}</div>
                        </div>
                    `;
                }
                
                // Load pedidos table
                const tbody = document.getElementById('pedidosTableBody');
                if (tbody && pedidos.length > 0) {
                    tbody.innerHTML = '';
                    
                    for (const pedido of pedidos) {
                        const row = document.createElement('tr');
                        
                        // Get colaborador name
                        let colaboradorNome = 'Desconhecido';
                        if (pedido.colaboradorId) {
                            const colDoc = await db.collection('colaboradores').doc(pedido.colaboradorId).get();
                            if (colDoc.exists) {
                                colaboradorNome = colDoc.data().nome;
                            }
                        }
                        
                        // Get pizza info
                        let pizzaNome = 'Desconhecida';
                        let pizzariaNome = 'Desconhecida';
                        let valor = 0;
                        
                        if (pedido.pizzaId) {
                            const pizzaDoc = await db.collection('pizzas').doc(pedido.pizzaId).get();
                            if (pizzaDoc.exists) {
                                const pizza = pizzaDoc.data();
                                pizzaNome = pizza.nome;
                                pizzariaNome = pizza.pizzaria;
                                valor = pizza.valor;
                            }
                        }
                        
                        row.innerHTML = `
                            <td>${colaboradorNome}</td>
                            <td>${pizzaNome}</td>
                            <td>${pizzariaNome}</td>
                            <td>${pedido.dataEntregaBR || formatDateBR(pedido.dataEntrega) || '-'}</td>
                            <td>R$ ${parseFloat(valor).toFixed(2)}</td>
                            <td><span class="badge ${pedido.status === 'entregue' ? 'active' : 'inactive'}">${pedido.status || 'pendente'}</span></td>
                        `;
                        tbody.appendChild(row);
                    }
                }
            } catch (error) {
                console.error('Error loading financeiro data:', error);
            }
        }

        // Checklist Functions
        async function toggleChecklistItem(colaboradorId, index) {
            showLoading();
            try {
                const checklistRef = db.collection('checklists').doc(`checklist_${colaboradorId}`);
                const doc = await checklistRef.get();
                
                let itens;
                if (doc.exists) {
                    itens = doc.data().itens;
                    itens[index].checked = !itens[index].checked;
                } else {
                    itens = getDefaultChecklistItems(currentSection);
                    itens[index].checked = true;
                }
                
                await checklistRef.set({
                    colaboradorId,
                    tipo: currentSection === 'vida' ? 'vida' : 'empresa',
                    itens,
                    dataAtualizacao: new Date()
                }, { merge: true });
                
                // Update progress bar
                const checkedCount = itens.filter(item => item.checked).length;
                const progress = (checkedCount / itens.length) * 100;
                const progressBar = document.getElementById(`progress-${colaboradorId}`);
                if (progressBar) {
                    progressBar.style.width = `${progress}%`;
                }
                
                // Update item text style
                const itemText = document.getElementById(`itemText-${colaboradorId}-${index}`);
                if (itemText) {
                    if (itens[index].checked) {
                        itemText.classList.add('checked');
                    } else {
                        itemText.classList.remove('checked');
                    }
                }
                
                showToast('Checklist atualizado com sucesso!', 'success');
            } catch (error) {
                console.error('Error updating checklist:', error);
                showToast('Erro ao atualizar checklist', 'error');
            } finally {
                hideLoading();
            }
        }

        // Export Functions
        function exportChecklist(colaboradorId) {
            const card = document.querySelector(`[data-colaborador-id="${colaboradorId}"]`);
            if (!card) return;
            
            const nome = card.querySelector('h4').textContent;
            const checklistItems = card.querySelectorAll('.checklist-item');
            
            let content = `Checklist - ${nome}\n`;
            content += `Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
            content += `Hora: ${new Date().toLocaleTimeString('pt-BR')}\n`;
            content += '='.repeat(40) + '\n\n';
            
            checklistItems.forEach(item => {
                const checkbox = item.querySelector('input[type="checkbox"]');
                const text = item.querySelector('.item-text').textContent;
                const status = checkbox.checked ? '[X]' : '[ ]';
                content += `${status} ${text}\n`;
            });
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `checklist_${nome}_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Checklist exportado com sucesso!', 'success');
        }

        async function editDepartamento(id) {
            const departamento = departamentos.find(d => d.id === id);
            if (!departamento) return;
            
            const novoNome = prompt('Novo nome do departamento:', departamento.nome);
            if (!novoNome) return;
            
            showLoading();
            try {
                await db.collection('departamentos').doc(id).update({
                    nome: novoNome
                });
                
                await loadDepartamentosList();
                showToast('Departamento atualizado com sucesso!', 'success');
            } catch (error) {
                console.error('Error editing departamento:', error);
                showToast('Erro ao atualizar departamento', 'error');
            } finally {
                hideLoading();
            }
        }

            if (!confirm('Tem certeza que deseja excluir este departamento?')) return;
            
            showLoading();
            try {
                await db.collection('departamentos').doc(id).delete();
                await loadDepartamentosList();

                console.error('Error deleting departamento:', error);

        // Pizza Order Functions
        async function savePizzaOrder(colaboradorId) {
            const pizzaId = document.getElementById(`pizzaSelect-${colaboradorId}`).value;
            const dataEntrega = document.getElementById(`pizzaData-${colaboradorId}`).value;
            const horarioEntrega = document.getElementById(`pizzaHora-${colaboradorId}`).value;
            const local = document.getElementById(`pizzaCidade-${colaboradorId}`).value;
            const enderecoCompleto = document.getElementById(`pizzaEndereco-${colaboradorId}`).value;
            const borda = document.querySelector(`input[name="borda-${colaboradorId}"]:checked`)?.value;
            const observacoes = document.getElementById(`pizzaObs-${colaboradorId}`).value;
            
            if (!pizzaId || !dataEntrega || !horarioEntrega || !local || !enderecoCompleto) {
                showToast('Preencha todos os campos obrigatórios', 'error');
                return;
            }
            
            if (!validateDateBR(dataEntrega)) {
                showToast('Data inválida', 'error');
                return;
            }
            
            showLoading();
            try {
                await db.collection('pedidos').add({
                    colaboradorId,
                    pizzaId,
                    dataEntrega: parseDateBR(dataEntrega),
                    dataEntregaBR: dataEntrega,
                    horarioEntrega,
                    local,
                    enderecoCompleto,
                    borda,
                    observacoes,
                    status: 'pendente',
                    dataCriacao: new Date()
                });
                
                // Clear form
                const pizzaSelect = document.getElementById(`pizzaSelect-${colaboradorId}`);
                if (pizzaSelect) pizzaSelect.value = '';
                
                const pizzaData = document.getElementById(`pizzaData-${colaboradorId}`);
                if (pizzaData) pizzaData.value = '';
                
                const pizzaHora = document.getElementById(`pizzaHora-${colaboradorId}`);
                if (pizzaHora) pizzaHora.value = '';
                
                const pizzaEndereco = document.getElementById(`pizzaEndereco-${colaboradorId}`);
                if (pizzaEndereco) pizzaEndereco.value = '';
                
                const pizzaObs = document.getElementById(`pizzaObs-${colaboradorId}`);
                if (pizzaObs) pizzaObs.value = '';
                
                const radios = document.querySelectorAll(`input[name="borda-${colaboradorId}"]`);
                radios.forEach(r => r.checked = false);
                
                togglePizzaOrder(colaboradorId);
                showToast('Pedido salvo com sucesso!', 'success');
            } catch (error) {
                console.error('Error saving pizza order:', error);
                showToast('Erro ao salvar pedido', 'error');
            } finally {
                hideLoading();
            }
        }

        // Filter Functions
        function filterVida() {
            const nome = document.getElementById('filtroNomeVida')?.value?.toLowerCase() || '';
            const mes = document.getElementById('filtroMesVida')?.value;
            const ano = document.getElementById('filtroAnoVida')?.value;
            const status = document.getElementById('filtroStatusVida')?.value;
            
            const cards = document.querySelectorAll('#vidaCardsList .person-card');
            
            cards.forEach(card => {
                const nomeColaborador = card.querySelector('h4').textContent.toLowerCase();
                const dataText = card.querySelector('.person-info p:last-child').textContent;
                const dataMatch = dataText.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                
                let show = true;
                
                if (nome && !nomeColaborador.includes(nome)) show = false;
                
                if (mes && dataMatch) {
                    const mesCard = parseInt(dataMatch[2]);
                    if (mesCard !== parseInt(mes)) show = false;
                }
                
                if (ano && dataMatch) {
                    const anoCard = parseInt(dataMatch[3]);
                    if (anoCard !== parseInt(ano)) show = false;
                }
                
                if (status && status !== 'todos' && dataMatch) {
                    const hoje = new Date();
                    const dataAniversario = new Date(hoje.getFullYear(), parseInt(dataMatch[2]) - 1, parseInt(dataMatch[1]));
                    
                    if (status === 'proximos' && dataAniversario < hoje) show = false;
                    if (status === 'passados' && dataAniversario >= hoje) show = false;
                }
                
                card.style.display = show ? 'block' : 'none';
            });
        }
